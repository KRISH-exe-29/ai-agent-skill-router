name: Feature request
description: A new platform, routing category or audit check
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: input
    id: docs
    attributes:
      label: Official docs link (for new platforms or paths)
