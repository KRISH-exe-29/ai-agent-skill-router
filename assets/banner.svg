<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">AI Agent Skill Router</title>
  <desc id="d">One router picks the right skills, subagents, plugins and MCP tools for every task, and an audit cleans up duplicates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#111A33"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="118" fill="#7DD3FC" font-size="20" font-weight="600" letter-spacing="4">OPEN-SOURCE · AGENT SKILLS · MCP</text>
    <text x="72" y="190" fill="#F8FAFC" font-size="64" font-weight="800" letter-spacing="-1">AI Agent</text>
    <text x="72" y="262" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#accent)">Skill Router</text>
    <text x="72" y="314" fill="#CBD5E1" font-size="22">The right skill, agent and MCP tool for every task,</text>
    <text x="72" y="346" fill="#CBD5E1" font-size="22">plus an audit that cleans up the rest.</text>
  </g>

  <!-- router graph -->
  <g transform="translate(700,40)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="17" font-weight="600">
    <circle cx="250" cy="160" r="120" fill="url(#glow)"/>
    <g stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M92 160 H190" stroke="#7DD3FC"/>
      <path d="M310 160 C 360 160, 360 52, 420 52"/>
      <path d="M310 160 C 360 160, 360 124, 420 124"/>
      <path d="M310 160 C 360 160, 360 196, 420 196"/>
      <path d="M310 160 C 360 160, 360 268, 420 268"/>
    </g>
    <rect x="0" y="134" width="92" height="52" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="46" y="166" fill="#E2E8F0" text-anchor="middle">Task</text>
    <rect x="190" y="110" width="120" height="100" rx="20" fill="#0F172A" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="250" y="152" fill="#F8FAFC" text-anchor="middle" font-size="19" font-weight="800">Router</text>
    <text x="250" y="178" fill="#94A3B8" text-anchor="middle" font-size="14" font-weight="500">picks best fit</text>
    <g>
      <rect x="420" y="30" width="132" height="44" rx="22" fill="#0C4A6E" stroke="#38BDF8"/>
      <text x="486" y="58" fill="#E0F2FE" text-anchor="middle">Skills</text>
      <rect x="420" y="102" width="132" height="44" rx="22" fill="#312E81" stroke="#818CF8"/>
      <text x="486" y="130" fill="#E0E7FF" text-anchor="middle">Subagents</text>
      <rect x="420" y="174" width="132" height="44" rx="22" fill="#4C1D95" stroke="#A78BFA"/>
      <text x="486" y="202" fill="#EDE9FE" text-anchor="middle">Plugins</text>
      <rect x="420" y="246" width="132" height="44" rx="22" fill="#134E4A" stroke="#2DD4BF"/>
      <text x="486" y="274" fill="#CCFBF1" text-anchor="middle">MCP tools</text>
    </g>
  </g>
</svg>
